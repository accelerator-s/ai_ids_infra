<section class="reviews">
  <div class="reviews__toolbar card">
    <div class="reviews__filter">
      <label class="field-label" for="review-status">复核状态</label>
      <div class="select" data-filter-status>
        <button class="select__trigger" id="review-status" type="button" data-select-trigger
          aria-haspopup="listbox" aria-expanded="false">
          <span data-select-value>待处理</span>
          <span class="select__chevron" aria-hidden="true">⌄</span>
        </button>
        <div class="select__list" data-select-list role="listbox" hidden></div>
      </div>
    </div>
    <div class="reviews__context">
      <span class="reviews__context-mark" aria-hidden="true"></span>
      <span>结论将直接写入检测记录；判定恶意后同步生成告警。</span>
    </div>
    <button class="btn btn--ghost reviews__refresh" type="button" data-refresh>
      <span class="icon" data-icon="refresh"></span>刷新队列
    </button>
  </div>

  <div class="reviews__workspace">
    <div class="reviews__queue card">
      <div class="reviews__queue-head">
        <div>
          <h3>复核队列</h3>
          <p data-count>正在读取…</p>
        </div>
      </div>
      <div class="reviews__items" data-list></div>
      <div class="reviews__pager" data-pager hidden>
        <button class="btn btn--ghost" type="button" data-prev>上一页</button>
        <span data-page>第 1 页</span>
        <button class="btn btn--ghost" type="button" data-next>下一页</button>
      </div>
    </div>

    <article class="reviews__case card" data-detail>
      <div class="reviews__blank">
        <span class="icon" data-icon="check"></span>
        <p>从左侧选择一条记录开始复核。</p>
      </div>
    </article>
  </div>
</section>
